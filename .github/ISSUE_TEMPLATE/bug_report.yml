---
name: Bug report
description: Something is broken or behaves incorrectly
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/EvgeniSasim/wp-eu-cookie-suite/issues) first.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: e.g. 1.3.1
    validations:
      required: true

  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: e.g. 6.8

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.2

  - type: dropdown
    id: multisite
    attributes:
      label: Multisite?
      options:
        - "No"
        - "Yes — subsite"
        - "Yes — network admin"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: PHP errors, browser console, or screenshots (no secrets).
