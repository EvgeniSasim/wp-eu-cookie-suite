---
name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or compliance need
      description: What user or legal requirement does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: Banner / UI
        - label: Script blocking / integrations
        - label: Scanner / cookie inventory
        - label: Consent log
        - label: Multisite
        - label: Documentation
