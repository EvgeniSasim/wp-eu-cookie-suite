name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PHP_VERSION=$(grep 'Version:' privaro-cookie-consent-banner/privaro-cookie-consent-banner.php | awk '{print $NF}')
          README_TAG=$(grep 'Stable tag:' privaro-cookie-consent-banner/readme.txt | awk '{print $NF}')
          echo "Tag: ${TAG}, PHP: ${PHP_VERSION}, readme: ${README_TAG}"
          test "${TAG}" = "${PHP_VERSION}"
          test "${TAG}" = "${README_TAG}"

      - name: Build release zip
        run: bash scripts/build-release.sh

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/privaro-cookie-consent-banner.zip
          body_path: release-notes.md
          generate_release_notes: false
